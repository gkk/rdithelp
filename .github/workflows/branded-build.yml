name: Build Branded RustDesk (macOS & Linux)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Име на приложението'
        required: true
        default: 'ITHelp4You Support'

env:
  RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
  RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

jobs:
  build-macos:
    name: Build Branded macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64 # Apple Silicon (M1-M4)
            target: aarch64-apple-darwin
          - arch: x86_64  # Intel Mac
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Custom Branding & Icons (macOS)
        run: |
          # 1. Смяна на името на приложението
          sed -i '' "s/RustDesk/${{ github.event.inputs.app_name }}/g" flutter/macos/Runner/Configs/AppInfo.xcconfig
          
          # 2. Генериране на всички macOS AppIcon размери от branding/logo.png чрез вградения sips
          ICON_DIR="flutter/macos/Runner/Assets.xcassets/AppIcon.appiconset"
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size branding/logo.png --out "$ICON_DIR/app_icon_${size}.png"
          done

          # 3. Подмяна на вътрешните икони на Flutter UI и tray
          sips -z 512 512 branding/logo.png --out res/icon.png
          sips -z 512 512 branding/logo.png --out flutter/assets/icon.png
          sips -z 64 64 branding/logo.png --out res/tray-icon.png

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Homebrew)
        run: |
          brew install nasm yasm cmake ninja pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS DMG
        run: |
          python3 build.py --flutter --hwcodec

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ithelp4you-macos-${{ matrix.arch }}
          path: flutter/build/macos/Build/Products/Release/*.dmg

  build-linux:
    name: Build Branded Linux (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gcc git curl wget nasm yasm libgtk-3-dev clang libxcb-randr0-dev \
            libxdo-dev libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libpulse-dev \
            cmake make libclang-dev ninja-build libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpam0g-dev xvfb imagemagick

      - name: Apply Custom Branding & Icons (Linux)
        run: |
          # 1. Подмяна на иконите за Linux desktop entry, UI и tray
          convert branding/logo.png -resize 512x512 res/icon.png
          convert branding/logo.png -resize 512x512 flutter/assets/icon.png
          convert branding/logo.png -resize 64x64 res/tray-icon.png
          
          # Подмяна на иконите в linux ресурсите (ако съществуват в текущата версия)
          find res/ -name "*icon*.png" -exec convert branding/logo.png -resize 256x256 {} \;

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Linux .deb package
        run: |
          python3 build.py --flutter --hwcodec

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ithelp4you-linux-amd64
          path: "*.deb"
